<html lang="pt-br" dir="ltr">
    <title>Página de Cadastro</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/pagina-de-cadastro-personal.css">

    <body>
        <header>
            <img src="assets/img/logo.png" alt="logo-gymforma">
            <nav>
                <a href="pagina-inicial-adm.html">Inicio</a>
                <a href="pagina-cadastro-adm.html">Sobre nós</a>
                <a href="pagina-inicial-adm.html">Contatos</a>
                <section class="perfil">
                    <img src="assets/img/foto-perfil.png" alt="foto-de-perfil" class="foto">
                    <a href="editar-perfil-adm.html">Olá,Lucas!</a>
                    <img src="assets/img/icone-seta-baixo.png" alt="seta-para-baixo" >
                </section>
            </nav>
        
        </header>

        <main>
            
            <form>
                <div class="titulo">
                    <h2>Adicionar</h2>
                    <h2 class="diferente">personal</h2>
                </div>
               
                <fieldset>
                    <legend>Preencha os campos </legend>
                    
                    <div class="nome">
                        <input type="tex" name="nome" placeholder="Nome completo" required/>
                        <img src="assets/img/icone-nome.png" alt="icone-nome">
                    </div>
                    
                    <div class="grupo1">
                        <img src="assets/img/icone-tefone-form.png" alt="icone-telefone" class="tel">
                        <input type="text" name="tel" placeholder="Telefone" required/>
 
                        <img src="assets/img/icone-email-form.png" alt="icone-email" class="email">
                        <input type="email" name="email" placeholder="E-mail" required/>

                    </div>

                    <div class="grupo2">
                        <img src="assets/img/icone-especialidade.png" alt="icone-especialidade" class="especial">
                        <input type="text" name="especialidade" placeholder="Especialidade" required/>

                        <img src="assets/img/icone-horario.png" alt="icone-horario" class="hora">
                        <input type="time" name="horario" placeholder="Horário Disponível" required/>

                    </div>

                    <div class="senha">
                        <img src="assets/img/icone-senha.png" alt="icone-senha">
                        <input type="text" name="senha" placeholder="Senha" maxlength="9" required/>
       
                    </div>
                </fieldset>

                

                <div class="botao">
                    <a href="pagina-inicial-adm.html" class="btn">Adicionar Conta</a>
                </div>
                
            </form>
            <img src="assets/img/imgem-de-fundo.png" alt="personal-da-academia-de-bracos-cruzados-no-fundo">
        </main>
        <footer class="rodape">
            <div class="rodape__conteudo">

                <!-- LOGO + COPYRIGHT -->
                <div class="rodape__marca">
                    <a href="#" class="rodape__logo">
                    <img src="assets/img/logo.png" alt="GymFORMA" />
                    </a>

                    <p class="rodape__direitos">
                    © 2026 GymFORMA. Todos os direitos reservados.
                    </p>
                </div>

                <!-- CONTATO -->
                <div class="rodape__contato">
                    <h4 class="rodape__titulo">Contato</h4>

                    <ul class="rodape__lista">
                    <li>
                        <img src="assets/img/localizacao-footer.png" alt="Nossa localização" />
                        <span>Cidade das Academias</span>
                    </li>

                    <li>
                        <img src="assets/img/telefone-footer.png" alt="Nosso telefone" />
                        <span>(00) 99999-9999</span>
                    </li>

                    <li>
                        <img src="assets/img/email-footer.png" alt="Nosso email" />
                        <span>contato@gymforma.com</span>
                    </li>
                    </ul>
                </div>

                <!-- REDES SOCIAIS -->
                <div class="rodape__redes">
                    <h4 class="rodape__titulo">Siga-nos</h4>

                    <div class="rodape__redes-lista">
                        <a href="#" class="rodape__rede">
                            <img class="rodape__rede-img" src="assets/img/intagram.png" />
                        </a>

                        <a href="#" class="rodape__rede">
                            <img class="rodape__rede-img" src="assets/img/whatsapp.png" alt="WhatsApp" />
                        </a>

                        <a href="#" class="rodape__rede">
                            <img class="rodape__rede-img" src="assets/img/youtube.png" alt="YouTube" />
                        </a>
                    </div>
                </div>

            </div>
        </footer>



    </body>

</html>
