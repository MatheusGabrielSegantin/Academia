        <meta charset="utf-8">
        <link rel="stylesheet" href="assets/css/4editar-perfil-aluno.css">

    <body>

        <header>
            <img src="assets/img/logo.png" alt="logo"  height="70px">
            <nav>
                <a href="5dasktop-aluno.html">Inicio</a>
                <a href="5dasktop-aluno.html">Sobre nós</a>
                <a href="5dasktop-aluno.html">Contatos</a>
                <section class="perfil">
                    <img src="assets/img/foto-perfil.png" alt="foto-de-perfil" class="foto">
                    <a href="4editar-perfil-aluno.html">Olá,Lucas!</a>
                    <img src="assets/img/icone-seta-baixo.png" alt="seta-para-baixo" ">
                </section>
            </nav>
        </header>

    
<main>
    <section>
        <h3>Editar perfil</h3>
        <p>Atualize suas informações pessoais</p>

        <form class="formularios">
            <fieldset class="juntos">

                <div class="nome">
                    <img src="assets/img/icone-nome.png" alt="icone-nome">
                    <input type="text" id="nome" name="nome" placeholder="Nome completo" required/>
                </div>

                <div class="email">
                    <img src="assets/img/icone-email-form.png" alt="icone-email">
                    <input type="email" id="email" name="email" placeholder="E-mail" required/>
                </div>

                <div class="senha">
                    <img src="assets/img/icone-senha.png" alt="icone-senha">
                    <input type="password" id="senha" name="senha" placeholder="Senha" maxlength="9" required/>
                </div>

                <div class="idade">
                    <img src="assets/img/idade.png" alt="icone-idade">
                    <input type="number" id="idade" name="idade" placeholder="Idade" required/>
                </div>

                <div class="peso-altura">
                
                    <input type="number" id="peso" name="peso" placeholder="Peso (Kg)" required>
                    <input type="number" id="altura" name="altura" placeholder="Altura (cm)" required>
                </div>

                <div class="objetivo">
                    <img src="assets/img/objetivo.png" alt="icone-objetivo">
                    <input type="text" id="objetivo" name="objetivo" placeholder="Objetivo Fitness" required>
                </div>

                <div class="botao">
                    <button type="submit">
                      <a href="5dasktop-aluno.html">Salvar</a>
                      </button>
                </div>

            </fieldset>
        </form>
    </section>
</main>
